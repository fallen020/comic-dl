[project]
name = "comic-dl-fakeexample"
version = "1.0.0"
description = "Reference comic-dl scraper plugin (fake domain)."
requires-python = ">=3.11"
dependencies = ["curl-cffi", "comic-dl"]

[project.entry-points."comic_dl.sources"]
fakeexample = "my_site.source:FakeExampleSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_site"]