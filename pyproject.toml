[project]
name = "comic-dl"
version = "0.0.1"
description = "Download comic and manga galleries from supported websites and compile them into CBZ/ZIP archives."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Comic Downloader contributors" }]
keywords = ["comic", "manga", "cbz", "downloader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "beautifulsoup4>=4.15",
    "lxml>=6.1.3",
    "rich>=15.0",
    "curl-cffi>=0.16.1",
    "platformdirs>=4.0",
    "defusedxml>=0.7.1",
    "pywebview>=6.2.1",
]

[project.urls]
Homepage = "https://github.com/fallen020/comic-dl"
Repository = "https://github.com/fallen020/comic-dl"
Issues = "https://github.com/fallen020/comic-dl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comic_dl"]

[tool.hatch.build.targets.sdist]
exclude = ["packaging/deb"]

[tool.hatch.build.hooks.custom]
path = "packaging/hatch/version_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.16.6,<1.0",
    "mypy>=2.3.1,<3.0",
    "bandit>=1.9.4,<2.0",
    "pyinstaller>=6.0,<7.0",
    "types-defusedxml>=0.7,<0.8",
]
docs = [
    "pymarkdownlnt>=0.9.39",
]

[project.scripts]
comic-dl = "comic_dl.__main__:entry"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "perf: performance regression smoke test (offline, no wall-clock assertions)",
]

[tool.coverage.run]
branch = true
source = ["comic_dl"]
omit = ["src/comic_dl/webview.py", "src/comic_dl/webview_solver.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts", "packaging"]

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "D",
]

ignore = [
  "B008",
  "D102", "D105", "D107",
  "D200", "D202", "D203", "D204", "D205", "D209", "D210",
  "D212", "D213", "D214", "D215", "D300", "D301", "D400",
  "D401", "D402", "D403", "D404", "D405", "D406", "D407",
  "D408", "D409", "D410", "D411", "D412", "D413", "D414",
  "D415", "D416", "D417", "D418", "D419",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D100", "D101", "D103", "D104", "D106", "D107",
  "RUF012",
  "E501",
]

[tool.mypy]
python_version = "3.11"
files = [
    "src/comic_dl",
    "scripts/write-version.py",
    "packaging/versioning.py",
    "packaging/hatch/version_hook.py",
]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false
