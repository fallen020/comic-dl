  "https://github.com/fallen020/comic-dl/releases/latest/download/",
  "https://pypi.org/project/comic-dl/",
  "https://e-hentai.org/",
  "https://pawchive.pw/",
  "https://cdn.mysite.example/",
  "https://mysite.example/",
  "https://fonts.googleapis.com/",
  "http://www.w3.org/2000/svg",
  "https://...",
]