name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the Astro docs site and runs its post-build gates. The deploy
  # workflow only fires on main, so without this a website change reaches the
  # live site before anything has built it.
  website:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      # Pagefind indexes the static output post-build.
      - run: npm run build:search

      - run: npm run check

      - run: npm audit --omit=dev

      # Mirror integrity (stdlib-only): every page maps to a docs/ source and
      # back, and no route link 404s.
      - run: python3 ../scripts/check-docs-mirror.py --check

      # Published files, SEO/AI surfaces, and internal link integrity.
      - run: python3 scripts/check-site.py

      - run: node scripts/check-contrast.mjs

  # Full OS x Python matrix: the package targets all three OSes.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # macos-14 is arm64 (macos-13 was the last Intel image).
          - macos-14
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      # SHA-pinned (not tag-pinned): a compromised action can't move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Key the uv cache off uv.lock (not the commit) so runs with an
          # unchanged lockfile share one cache instead of one per ref.
          cache-dependency-glob: &uv-cache-glob uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests with coverage
        shell: bash
        run: ./scripts/test.sh --cov=comic_dl --cov-report=xml --cov-report=term

      # One artifact from the fixed cell only; all 12 cells would collide.
      # Reported for review, not enforced as a gate.
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          # Informational only; a week is plenty to review a PR's report.
          retention-days: 7

  # Environment-independent; one runner suffices, own job so it can't hide
  # test failures.
  lint:
    name: lint (ruff, mypy, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: *uv-cache-glob

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint, type check, static security scan
        run: ./scripts/lint.sh

  # Runtime deps only (dev deps excluded); result doesn't vary by OS/Python.
  # Secret-free so fork PRs stay safe.
  security:
    name: security (audit runtime dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: *uv-cache-glob

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit runtime dependencies
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project --output-file /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt

  # Build sdist + wheel, install into a fresh venv (no source tree access),
  # smoke-test. Ubuntu only: OS-agnostic, other jobs cover the platforms.
  package:
    name: package (build + clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: *uv-cache-glob

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Install wheel into a fresh venv
        run: |
          uv venv /tmp/pkgtest
          uv pip install --python /tmp/pkgtest/bin/python dist/comic_dl-*.whl

      - name: Smoke test the installed package (no source tree)
        run: |
          cd /tmp
          /tmp/pkgtest/bin/comic-dl --version
          /tmp/pkgtest/bin/comic-dl --help >/dev/null
          /tmp/pkgtest/bin/python - <<'EOF'
          import importlib.metadata
          import comic_dl
          assert comic_dl.__version__ == importlib.metadata.version("comic-dl")
          print("installed package import + metadata parity OK")
          EOF

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: *uv-cache-glob

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra docs --locked

      - name: Docs
        run: ./scripts/docs.sh

      - name: Check external links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --no-progress README.md docs