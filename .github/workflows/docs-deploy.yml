name: Deploy docs site

# Builds the Astro docs site in website/ and publishes it to GitHub Pages.
# Only runs when the site or its workflow changed; the Plain-Markdown docs/
# tree is the content source of truth and needs no deploy.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Pagefind indexes the static output post-build.
      - run: npm run build:search
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
        id: deployment