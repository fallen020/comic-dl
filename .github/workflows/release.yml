name: Release

# Optional publish jobs at the bottom (AUR/COPR/winget) require these secrets:
#   AUR_SSH_PRIVATE_KEY, COPR_LOGIN, COPR_USERNAME, COPR_TOKEN, WINGET_TOKEN
# The macOS extension point (if ever enabled) requires APPLE cert + notarization
# secrets. They are intentionally commented out - enable them once the secrets
# exist and signing/notarization are implemented.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Default: tag name, or 'dev'."
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true  # a new tag cancels the in-flight release

env:
  VER: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'dev' }}

jobs:
  # sdist + wheel (py3-none-any). The wheel installs on every OS/arch, so a
  # single package serves all platforms.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout (job-level perms default unlisted scopes to none)
      id-token: write  # trusted publishing to PyPI (OIDC)
      attestations: write  # SLSA build-provenance attestations (Sigstore)
    steps:
      - name: Require a version (reject dev-tagged release)
        env:
          VERSION_HINT: ${{ env.VER }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$IS_TAG" == "false" && -z "$VERSION_HINT" ]]; then
            echo "error: workflow_dispatch requires the 'version' input" >&2
            echo "a bare dispatch would otherwise publish a Release tagged 'dev'" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag/version consistency gate
        env:
          VERSION_HINT: ${{ env.VER }}
        run: |
          ver="${VERSION_HINT#v}"
          if [[ -n "$ver" && "$ver" != "dev" ]]; then
            pkgv="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
            if [[ "$pkgv" != "$ver" ]]; then
              echo "error: pyproject.toml version '$pkgv' != tag '$ver'" >&2
              exit 1
            fi
            uv run scripts/write-version.py --check
          fi
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        # Best-effort: PyPI needs a trusted publisher registered out-of-band,
        # and its absence must not block the GitHub Release below.
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: py-wheel
          path: dist/*
          if-no-files-found: error
      - name: Attest build provenance (Sigstore, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  # Vendored wheels, built once per arch and shared by every distro job.
  # pip resolves arch-specific binaries (curl-cffi abi3) for the runner
  # arch, so this runs natively on both arches.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            wheelarch: amd64
          - runs-on: ubuntu-24.04-arm
            wheelarch: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build vendored wheels
        run: |
          lock_version() {
            awk -v pkg="$1" '
              $0 == "name = \"" pkg "\"" { f=1 }
              f && /^version =/ { gsub(/"/, "", $3); print $3; exit }
            ' uv.lock
          }
          mkdir -p .wheels-out
          python3 -m pip wheel --no-deps --no-cache-dir --wheel-dir .wheels-out .
          python3 -m pip wheel --no-deps --no-cache-dir --wheel-dir .wheels-out "curl-cffi==$(lock_version curl-cffi)"
          python3 -m pip wheel --no-deps --no-cache-dir --wheel-dir .wheels-out "pywebview==$(lock_version pywebview)"
          python3 -m pip wheel --no-deps --no-cache-dir --wheel-dir .wheels-out "proxy-tools==$(lock_version proxy-tools)"
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.wheelarch }}
          path: .wheels-out/*
          if-no-files-found: error
          # Consumed by linux-packages in this run only.
          retention-days: 1

  # Linux distro packages. The vendored curl_cffi wheel bundles native
  # libcurl-impersonate shared objects, so each package is architecture-
  # specific: build every distro in a native container per arch (arm64 rows
  # run on arm runners). One .deb/.rpm/.pkg.tar.zst per distro per arch.
  linux-packages:
    needs: wheels
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read  # actions/checkout (job-level perms default unlisted scopes to none)
      id-token: write  # attest-build-provenance needs an OIDC token for Sigstore signing
      attestations: write  # SLSA build-provenance attestations (Sigstore)
      actions: write  # distro package cache save/restore
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 rows run on native arm runners; nothing here is emulated.
          - distro: debian
            runs-on: ubuntu-latest
            image: debian:stable
            platform: linux/amd64
            build: bash /src/packaging/deb/build.sh docker-build
            artifact: deb-amd64
            wheelarch: amd64
            cachedir: apt
            cachetarget: /var/cache/apt/archives
            outdir: /tmp/debian-amd64-out
            validate: deb/validate.sh
            glob: "*.deb"
          - distro: debian
            runs-on: ubuntu-24.04-arm
            image: debian:stable
            platform: linux/arm64
            build: bash /src/packaging/deb/build.sh docker-build
            artifact: deb-arm64
            wheelarch: arm64
            cachedir: apt
            cachetarget: /var/cache/apt/archives
            outdir: /tmp/debian-arm64-out
            validate: deb/validate.sh
            glob: "*.deb"
          - distro: fedora
            runs-on: ubuntu-latest
            image: fedora:latest
            platform: linux/amd64
            build: bash /src/packaging/rpm/build.sh
            artifact: rpm-x86_64
            wheelarch: amd64
            cachedir: dnf
            cachetarget: /var/cache/dnf
            outdir: /tmp/fedora-x86_64-out
            validate: rpm/validate.sh
            glob: "*.rpm"
          - distro: fedora
            runs-on: ubuntu-24.04-arm
            image: fedora:latest
            platform: linux/arm64
            build: bash /src/packaging/rpm/build.sh
            artifact: rpm-aarch64
            wheelarch: arm64
            cachedir: dnf
            cachetarget: /var/cache/dnf
            outdir: /tmp/fedora-aarch64-out
            validate: rpm/validate.sh
            glob: "*.rpm"
          - distro: arch
            runs-on: ubuntu-latest
            image: archlinux:latest
            platform: linux/amd64
            build: bash /src/packaging/arch/build.sh
            artifact: arch-x86_64
            wheelarch: amd64
            cachedir: pacman
            cachetarget: /var/cache/pacman/pkg
            outdir: /tmp/arch-x86_64-out
            validate: arch/validate.sh
            glob: "*.pkg.tar.zst"
          # No arch/arm64 entry: archlinux:latest ships no arm64 manifest, so
          # the image cannot be pulled on arm runners either.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set package cache week
        run: echo "CACHE_WEEK=$(date -u +%Y-W%V)" >> "$GITHUB_ENV"
      # Distro package downloads, shared across runs. Keyed per artifact
      # (caches are arch-specific) with a weekly rotation; a stale cache
      # only costs re-downloads, never a wrong install.
      - name: Restore distro package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pkg-cache/${{ matrix.cachedir }}
          key: pkg-${{ matrix.artifact }}-${{ env.CACHE_WEEK }}
          restore-keys: |
            pkg-${{ matrix.artifact }}-
      - name: Download vendored wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels-${{ matrix.wheelarch }}
          path: .wheels/${{ matrix.wheelarch }}
      - name: Build package in container
        run: |
          mkdir -p "${{ matrix.outdir }}"
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ matrix.outdir }}:/out" \
            -v "${{ github.workspace }}/.pkg-cache/${{ matrix.cachedir }}:${{ matrix.cachetarget }}" \
            -v "${{ github.workspace }}/.wheels:/wheels:ro" \
            -e VERSION="${{ env.VER }}" \
            -e WHEEL_DIR=/wheels/${{ matrix.wheelarch }} \
            ${{ matrix.image }} \
            bash -c "${{ matrix.build }}"
      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.outdir }}/*
          if-no-files-found: error
      - name: Validate package in clean container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ matrix.outdir }}:/pkg:ro" \
            -v "${{ github.workspace }}/.pkg-cache/${{ matrix.cachedir }}:${{ matrix.cachetarget }}" \
            -e EXPECTED_VERSION="${{ env.VER }}" \
            ${{ matrix.image }} \
            bash /src/packaging/${{ matrix.validate }} "/pkg/${{ matrix.glob }}"
      # Containers run as root, so hand the cache back to the runner user
      # before the save step. Runs on failure too so failed runs still
      # populate the cache. Wheels only need to stay world-readable for
      # the builder user inside the arch container.
      - name: Fix cache and wheel ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" .pkg-cache .wheels 2>/dev/null || true
          chmod -R a+rX .wheels 2>/dev/null || true
      # Containers run as root, so hand the cache back to the runner user
      # before the save step. Runs on failure too so failed runs still
      # populate the cache.
      - name: Fix package cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .pkg-cache 2>/dev/null || true
      # Attest after validation: only packages that installed and
      # smoke-tested cleanly carry build provenance into the release.
      - name: Attest build provenance (Sigstore, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ matrix.outdir }}/*"

  # Windows standalone exe. Built natively on a Windows runner (never
  # cross-compiled from Linux). Artifact naming follows the
  # comic-dl-<version>-windows-<arch> scheme used across all release files.
  # The exe is unsigned (see docs/develop/releasing.md#Code-signing).
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read  # actions/checkout (job-level perms default unlisted scopes to none)
      id-token: write  # attest-build-provenance needs an OIDC token for Sigstore signing
      attestations: write  # SLSA build-provenance attestations (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build binary
        shell: pwsh
        run: ./scripts/build-binary.ps1
      - name: Smoke test exe and gate version
        shell: pwsh
        run: |
          $ver = "$env:VER".TrimStart('v')
          $got = (& "dist\comic-dl.exe" --version | Out-String).Trim()
          if (-not $got.StartsWith("comic-dl ")) {
            throw "unexpected --version output: '$got'"
          }
          if ($ver -and $ver -ne "dev") {
            $want = "comic-dl $ver"
            if ($got -ne $want) { throw "version mismatch: got '$got', want '$want'" }
          }
          & "dist\comic-dl.exe" --help | Out-Null
      - name: Stage windows-amd64 zip
        shell: pwsh
        run: |
          $ver = "$env:VER".TrimStart('v')
          $stage = "staging/windows-amd64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/comic-dl.exe "$stage/comic-dl.exe"
          Copy-Item README.md $stage/
          Copy-Item LICENSE $stage/
          @'
          @echo off
          chcp 65001 >nul
          "%~dp0comic-dl.exe" %*
          '@ | Set-Content -Encoding Ascii "$stage/comic-dl.bat"
          $zip = "comic-dl-$ver-windows-amd64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Move-Item $zip out/
          Copy-Item dist/comic-dl.exe "out/comic-dl-$ver-windows-amd64.exe"
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package
          path: out/*
          if-no-files-found: error
      - name: Attest build provenance (Sigstore, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "out/*"

