    # Final assembly: download every artifact, checksum them, attach to the tag's
    # GitHub Release.
    release:
      needs: [package, linux-packages, windows-build]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
          with:
            path: dist
            merge-multiple: true
        - name: Generate SHA256SUMS
          run: |
            cd dist
            sha256sum * > SHA256SUMS
        - name: Publish GitHub Release
          uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
          with:
            tag_name: ${{ env.VER }}
            name: comic-dl ${{ env.VER }}
            body: |
              ## comic-dl ${{ env.VER }}

              Downloads comic/manga galleries from supported websites and
              compiles them into verified CBZ, ZIP, and CBT archives.

              ### What's in the box
              - 12 built-in sources plus a plugin API (`comic-dl --list-sources`)
              - Parallel downloads paced by a per-host rate limiter, with retry
                and resume (`--concurrency`, SQLite library, `.partial` markers)
              - Verified archives: magic-byte checks, SHA-256 dedup, atomic
                writes, `ComicInfo.xml` metadata at series and chapter level
              - Cloudflare handling: TLS/HTTP impersonation and a system-webview
                solver for managed challenges
              - SSRF-hardened outbound traffic; retries back off politely
              - Offline-safe automated test suite (no live network in CI)

              ### Install
              - Python package: download the wheel or sdist below and
                `pip install <file>` (Python 3.11+). PyPI publishing is enabled
                by a trusted publisher only when one is configured; the artifacts
                on this release are always installable directly.
              - Windows: `comic-dl-${{ env.VER }}-windows-amd64.zip` (standalone exe)
              - Linux: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL),
                `.pkg.tar.zst` (Arch) for amd64 and arm64
              - See docs/ for per-platform commands

              ### Known limitations
              - Windows ARM64 and macOS binaries are not shipped yet — use `uvx`
              - The Windows binary is unsigned
              - Early maturity — read the README status banner before use

              All artifacts are checksummed in `SHA256SUMS`.
            files: dist/*
            generate_release_notes: true

