  # Final assembly: download every artifact, checksum them, attach to the tag's
  # GitHub Release.
  release:
    needs: [package, linux-packages, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish the GitHub Release and attach assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # Site-support manifest ships as a release asset so `self site check`
      # reads exactly the adapters this tag contains.
      - name: Stage site-support manifest
        run: cp site-support.json dist/
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Extract changelog entry
        id: changelog
        run: |
          ver="${VER#v}"
          # Grab the section for this version (from its heading to the next
          # ## heading or EOF).  The heading format is: ## [vX.Y.Z] - DATE
          entry=$(awk -v pat="## [v${ver}]" '
            /^## \[/ {
              if (found) exit
              if (index($0, pat) == 1) found=1
            }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$entry" ]]; then
            echo "warning: no changelog entry for $ver" >&2
            entry="No changelog entry found for this version."
          fi
          # Write to file to avoid shell quoting issues in the multiline body.
          echo "$entry" > /tmp/changelog-body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VER }}
          name: comic-dl ${{ env.VER }}
          body_path: /tmp/changelog-body.md
          files: dist/*
          generate_release_notes: true

