    # Android: comic-dl is pure-Python; there is no Android-hosted GitHub
    # runner and no supported packaging target. Users on Android run it through
    # Termux (pip/uv install of the sdist) or a local Python on a Windows PC.
    # No CI job is planned.

    # Optional: build an .msi installer with WiX. Skipped for now - the raw exe
    # and the zip cover Windows installs.
