    # macOS: the webview solver uses WKWebView (works on macOS), but Apple
    # requires signing + notarization before distributing a GUI .app outside
    # the Mac App Store. Until that pipeline lands, macOS binaries are NOT
    # published. This job is the extension point: build one universal2 .app per
    # runner (macos-latest is arm64; macos-13 is x86_64 for the Intel build),
    # then codesign + notarize with secrets APPLE_CERT/APPLE_P12 etc. CI smoke:
    # `dist/comic-dl --version` (no notarization needed to test).
